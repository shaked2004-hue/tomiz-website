<section class="contact" id="contact">
  <div class="wrap">
    <div class="reveal">
      <div class="eyebrow" style="color:var(--pink-soft)">Let's talk</div>
      <h2>Leave your details and I'll get back to you</h2>
      <p class="sub">A question, a collaboration idea, a workshop, a talk or support for your experts: tell me briefly and I'll get back to you soon.</p>
      <div class="lines"><a href="mailto:office@tomizs.com">office@tomizs.com</a><a href="tel:+972525012413" dir="ltr">+972-52-5012413</a></div>
    </div>
    <form id="lead" data-source="Contact form (EN)" novalidate class="reveal d1">
      <label for="f-name">Name<input id="f-name" name="name" autocomplete="name" required></label>
      <label for="f-phone">Phone<input id="f-phone" name="phone" type="tel" autocomplete="tel" required pattern="[0-9+\-\s()]{9,}"></label>
      <label for="f-mail">Email<input id="f-mail" name="email" type="email" autocomplete="email" required></label>
      <label for="f-org">Company (optional)<input id="f-org" name="org" autocomplete="organization"></label>
      <label for="f-type">Topic<select id="f-type" name="type"><option>General question</option><option>Workshop or program for an organization</option><option>Talk for a conference or event</option><option>Support for experts and professionals</option><option>Collaboration</option><option>Something else</option></select></label>
      <label for="f-msg">How can I help?<textarea id="f-msg" name="msg" rows="3"></textarea></label>
      <div class="hp" aria-hidden="true"><label for="f-web">Website<input id="f-web" name="website" tabindex="-1" autocomplete="off"></label></div>
      <label class="consent" for="f-ok"><input id="f-ok" type="checkbox" required> I agree that my details are stored so you can get back to me, as described in the <a href="#privacy">privacy policy</a>.</label>
      <button class="btn primary" type="submit">Send</button>
      <div class="form-note" id="form-note" role="status"></div>
    </form>
  </div>
</section>
